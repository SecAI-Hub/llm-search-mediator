name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release-gate:
    name: Verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated SemVer tag on main
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          semver = re.compile(
              r"^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
              r"(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          )
          if semver.fullmatch(tag) is None:
              print(f"release tag is not strict SemVer: {tag!r}", file=sys.stderr)
              sys.exit(1)
          PY
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git cat-file -p "$GITHUB_REF" | sed -n '2s/^type //p')" = commit
          test "$(git rev-parse "$GITHUB_REF^{}")" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

  test:
    name: Test
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Dependency audit
        run: |
          python -m pip check
          python -m pip_audit -r requirements.lock --disable-pip
          python -m pip_audit -r requirements-dev.lock --disable-pip
      - name: Static checks
        run: |
          ruff check search_mediator tests
          bandit -q -r search_mediator
          python -m compileall -q search_mediator
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Require immutable action references
        run: |
          python - <<'PY'
          import pathlib
          import re

          for workflow in pathlib.Path(".github/workflows").glob("*.yml"):
              for number, line in enumerate(workflow.read_text().splitlines(), 1):
                  match = re.search(r"\buses:\s*[^@\s]+@([^\s#]+)", line)
                  if match and not re.fullmatch(r"[0-9a-f]{40}", match.group(1)):
                      raise SystemExit(f"{workflow}:{number}: action is not SHA-pinned")
          PY
      - name: Build and inspect non-writable container
        run: |
          docker build --pull=false -f Containerfile -t llm-search-mediator:release-test .
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --entrypoint sh llm-search-mediator:release-test -c \
            'test "$(stat -c %u /app/search_mediator/app.py)" = 0 && test ! -w /app/search_mediator/app.py'
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --entrypoint python llm-search-mediator:release-test -c \
            'import search_mediator.app'
      - name: Scan container for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-search-mediator:release-test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  container:
    name: Build & Push Container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive collision-free immutable image tag
        id: release-tag
        shell: bash
        run: echo "value=${GITHUB_REF_NAME//+/_}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release-tag.outputs.value }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container image with cosign (keyless)
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build source archive
        run: git archive --format=tar.gz --prefix=llm-search-mediator/ --output=llm-search-mediator-source.tar.gz HEAD

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: llm-search-mediator-source.tar.gz

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: llm-search-mediator-source.tar.gz
